<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="clutch-title clutch-description">
  <title id="clutch-title">Clutch — Control your desktops with your mouse</title>
  <desc id="clutch-description">A repeating illustrated demonstration. Hold Control and press the forward side button to slide the desktop left. Hold Control and press the back side button to slide it right. The keyboard and mouse highlight the buttons as they are pressed.</desc>
  <style>
    #clutch-demo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #clutch-demo .line { fill: none; stroke: #344055; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #clutch-demo .muted-line { fill: none; stroke: #b9c3d2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #clutch-demo .ink { fill: #263247; }
    #clutch-demo .muted { fill: #56657b; }
    #clutch-demo .key-letter { fill: #56657b; font-size: 14px; text-anchor: middle; }
    #clutch-demo .motion { animation-duration: 8s; animation-iteration-count: infinite; }
    #clutch-demo .desktop-strip { animation-name: clutch-desktops; animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
    #clutch-demo .control-pressed { opacity: 0; animation-name: clutch-control; animation-timing-function: steps(1, end); }
    #clutch-demo .forward-pressed { opacity: 0; animation-name: clutch-forward; animation-timing-function: steps(1, end); }
    #clutch-demo .back-pressed { opacity: 0; animation-name: clutch-back; animation-timing-function: steps(1, end); }
    #clutch-demo .caption-idle { animation-name: clutch-idle-caption; animation-timing-function: steps(1, end); }
    #clutch-demo .caption-forward { opacity: 0; animation-name: clutch-forward-caption; animation-timing-function: steps(1, end); }
    #clutch-demo .caption-back { opacity: 0; animation-name: clutch-back-caption; animation-timing-function: steps(1, end); }
    @keyframes clutch-desktops {
      0%, 20% { transform: translateX(0); }
      31%, 70% { transform: translateX(-984px); }
      81%, 100% { transform: translateX(0); }
    }
    @keyframes clutch-control {
      0%, 12% { opacity: 0; }
      13%, 32% { opacity: 1; }
      33%, 62% { opacity: 0; }
      63%, 82% { opacity: 1; }
      83%, 100% { opacity: 0; }
    }
    @keyframes clutch-forward {
      0%, 18% { opacity: 0; }
      19%, 31% { opacity: 1; }
      32%, 100% { opacity: 0; }
    }
    @keyframes clutch-back {
      0%, 68% { opacity: 0; }
      69%, 81% { opacity: 1; }
      82%, 100% { opacity: 0; }
    }
    @keyframes clutch-idle-caption {
      0%, 12% { opacity: 1; }
      13%, 99% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes clutch-forward-caption {
      0%, 12% { opacity: 0; }
      13%, 62% { opacity: 1; }
      63%, 100% { opacity: 0; }
    }
    @keyframes clutch-back-caption {
      0%, 62% { opacity: 0; }
      63%, 99% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #clutch-demo .motion { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="clutch-screen-clip"><rect width="984" height="342"/></clipPath>
    <g id="clutch-key"><rect width="40" height="28" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/></g>
    <g id="clutch-folder" stroke="#344055" stroke-width="2" stroke-linejoin="round">
      <path d="M0 9V2a2 2 0 0 1 2-2h17l6 7h25a3 3 0 0 1 3 3v30a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3Z" fill="#e7edf8"/>
      <path d="M0 14h53v26a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3Z" fill="#fff"/>
    </g>
    <g id="clutch-window-dots">
      <circle r="4" fill="#f17a76"/><circle cx="15" r="4" fill="#e8bc5b"/><circle cx="30" r="4" fill="#7abca2"/>
    </g>
  </defs>

  <g id="clutch-demo">
    <rect width="1200" height="800" rx="16" fill="#f5f7fb"/>
    <text x="100" y="43" class="ink" font-size="26" font-weight="600">Clutch</text>
    <text x="1100" y="41" class="muted" font-size="17" text-anchor="end">Control + mouse. Switch desktops.</text>

    <!-- The monitor stays still; only the clipped desktop strip moves. -->
    <rect x="98" y="72" width="1004" height="410" rx="16" fill="#fff" stroke="#344055" stroke-width="3"/>
    <path d="M114 83h972a6 6 0 0 1 6 6v37H108V89a6 6 0 0 1 6-6Z" fill="#e9edf4"/>
    <text x="129" y="109" class="ink" font-size="15" font-weight="600">macOS</text>
    <text x="204" y="109" class="muted" font-size="14">File</text>
    <text x="249" y="109" class="muted" font-size="14">Edit</text>
    <text x="295" y="109" class="muted" font-size="14">View</text>
    <path d="m986 101 5 5 5-5m-14-4q9-8 18 0" class="line"/>
    <rect x="1013" y="98" width="20" height="10" rx="2" class="line"/>
    <path d="M1036 101v4" class="line"/>
    <text x="1078" y="109" class="ink" font-size="13" text-anchor="end">9:41</text>

    <g transform="translate(108 126)">
      <g clip-path="url(#clutch-screen-clip)">
        <g class="motion desktop-strip">
          <!-- Desktop 1: a simple Finder window and a folder on the desktop. -->
          <g>
            <rect width="984" height="342" fill="#eef2f8"/>
            <text x="26" y="33" class="muted" font-size="15">Desktop 1</text>
            <use href="#clutch-folder" x="867" y="52"/>
            <text x="894" y="116" class="muted" font-size="13" text-anchor="middle">Projects</text>
            <rect x="172" y="47" width="600" height="237" rx="10" fill="#fff" stroke="#344055" stroke-width="2"/>
            <path d="M182 48h580a9 9 0 0 1 9 9v28H173V57a9 9 0 0 1 9-9Z" fill="#f8f9fc"/>
            <use href="#clutch-window-dots" x="193" y="66"/>
            <text x="472" y="72" class="ink" font-size="14" font-weight="600" text-anchor="middle">Projects</text>
            <path d="M173 85h598" class="muted-line"/>
            <path d="M173 86h137v197H183a10 10 0 0 1-10-10Z" fill="#f0f3f8"/>
            <rect x="184" y="110" width="114" height="27" rx="5" fill="#dbe8ff"/>
            <text x="197" y="128" fill="#2055a1" font-size="13">Projects</text>
            <text x="197" y="165" class="muted" font-size="13">Documents</text>
            <text x="197" y="202" class="muted" font-size="13">Downloads</text>
            <use href="#clutch-folder" x="354" y="129"/>
            <use href="#clutch-folder" x="494" y="129"/>
            <use href="#clutch-folder" x="634" y="129"/>
            <text x="380" y="196" class="ink" font-size="13" text-anchor="middle">Clutch</text>
            <text x="520" y="196" class="ink" font-size="13" text-anchor="middle">Design</text>
            <text x="660" y="196" class="ink" font-size="13" text-anchor="middle">Notes</text>
            <path d="M353 236h335" class="muted-line"/>
          </g>

          <!-- Desktop 2 is adjacent, so forward moves the visible picture to the left. -->
          <g transform="translate(984 0)">
            <rect width="984" height="342" fill="#e6edf9"/>
            <text x="26" y="33" class="muted" font-size="15">Desktop 2</text>
            <rect x="236" y="42" width="534" height="251" rx="10" fill="#fff" stroke="#344055" stroke-width="2"/>
            <path d="M246 43h514a9 9 0 0 1 9 9v28H237V52a9 9 0 0 1 9-9Z" fill="#f8f9fc"/>
            <use href="#clutch-window-dots" x="257" y="61"/>
            <text x="503" y="67" class="ink" font-size="14" font-weight="600" text-anchor="middle">Notes</text>
            <path d="M237 80h532" class="muted-line"/>
            <text x="274" y="121" class="ink" font-size="22" font-weight="600">A little more room.</text>
            <path d="M274 144h277M274 156h221" class="muted-line"/>
            <rect x="274" y="181" width="14" height="14" rx="3" fill="#0a84ff"/>
            <path d="m278 188 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M302 188h188" class="muted-line"/>
            <rect x="274" y="216" width="14" height="14" rx="3" fill="#fff" stroke="#b9c3d2" stroke-width="1.5"/>
            <path d="M302 223h144" class="muted-line"/>
            <rect x="643" y="114" width="86" height="113" rx="5" fill="#eef3fc" stroke="#b9c3d2" stroke-width="1.5"/>
            <path d="M661 139h48M661 154h48M661 169h33" class="muted-line"/>
          </g>
        </g>
      </g>
    </g>

    <!-- A fixed Dock makes the desktop movement easy to read. -->
    <rect x="477" y="432" width="246" height="27" rx="7" fill="#fff" stroke="#b9c3d2" stroke-width="1.5"/>
    <rect x="490" y="439" width="14" height="14" rx="4" fill="#9dbef0"/>
    <rect x="519" y="439" width="14" height="14" rx="4" fill="#f0c97b"/>
    <rect x="548" y="439" width="14" height="14" rx="4" fill="#a9cdb9"/>
    <rect x="577" y="439" width="14" height="14" rx="4" fill="#c5b4e4"/>
    <rect x="606" y="439" width="14" height="14" rx="4" fill="#9dbef0"/>
    <path d="M638 438v16" class="muted-line"/>
    <rect x="651" y="439" width="14" height="14" rx="4" fill="#d0d8e5"/>
    <rect x="680" y="439" width="14" height="14" rx="4" fill="#d0d8e5"/>
    <path d="m559 483-8 28h98l-8-28" fill="#e2e7ef" stroke="#344055" stroke-width="2" stroke-linejoin="round"/>
    <path d="M532 519h136" class="line"/>

    <!-- Captions share one position and change at the same time as Control is held. -->
    <g font-size="23" font-weight="500" text-anchor="middle">
      <text x="600" y="565" class="motion caption-idle muted">Hold Control. Click a side button.</text>
      <g class="motion caption-forward">
        <text x="600" y="565" class="ink">Ctrl + Forward <tspan fill="#0a84ff"> ← </tspan>Slide left</text>
      </g>
      <g class="motion caption-back">
        <text x="600" y="565" class="ink">Ctrl + Back <tspan fill="#0a84ff"> → </tspan>Slide right</text>
      </g>
    </g>

    <!-- A compact keyboard: ordinary keys stay quiet, while Control lights up. -->
    <rect x="141" y="600" width="605" height="163" rx="12" fill="#e9edf4" stroke="#344055" stroke-width="2"/>
    <g transform="translate(157 613)">
      <g>
        <use href="#clutch-key"/><use href="#clutch-key" x="48"/><use href="#clutch-key" x="96"/><use href="#clutch-key" x="144"/><use href="#clutch-key" x="192"/><use href="#clutch-key" x="240"/><use href="#clutch-key" x="288"/><use href="#clutch-key" x="336"/><use href="#clutch-key" x="384"/><use href="#clutch-key" x="432"/><use href="#clutch-key" x="480"/><use href="#clutch-key" x="528"/>
        <g class="key-letter" transform="translate(20 19)"><text>Q</text><text x="48">W</text><text x="96">E</text><text x="144">R</text><text x="192">T</text><text x="240">Y</text><text x="288">U</text><text x="336">I</text><text x="384">O</text><text x="432">P</text><text x="480">[</text><text x="528">]</text></g>
      </g>
      <g transform="translate(12 36)">
        <use href="#clutch-key"/><use href="#clutch-key" x="48"/><use href="#clutch-key" x="96"/><use href="#clutch-key" x="144"/><use href="#clutch-key" x="192"/><use href="#clutch-key" x="240"/><use href="#clutch-key" x="288"/><use href="#clutch-key" x="336"/><use href="#clutch-key" x="384"/><use href="#clutch-key" x="432"/>
        <rect x="480" width="76" height="28" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/>
        <g class="key-letter" transform="translate(20 19)"><text>A</text><text x="48">S</text><text x="96">D</text><text x="144">F</text><text x="192">G</text><text x="240">H</text><text x="288">J</text><text x="336">K</text><text x="384">L</text><text x="432">;</text><text x="498">return</text></g>
      </g>
      <g transform="translate(24 72)">
        <use href="#clutch-key"/><use href="#clutch-key" x="48"/><use href="#clutch-key" x="96"/><use href="#clutch-key" x="144"/><use href="#clutch-key" x="192"/><use href="#clutch-key" x="240"/><use href="#clutch-key" x="288"/><use href="#clutch-key" x="336"/><use href="#clutch-key" x="384"/>
        <rect x="432" width="112" height="28" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/>
        <g class="key-letter" transform="translate(20 19)"><text>Z</text><text x="48">X</text><text x="96">C</text><text x="144">V</text><text x="192">B</text><text x="240">N</text><text x="288">M</text><text x="336">,</text><text x="384">.</text><text x="468">shift</text></g>
      </g>
      <g transform="translate(0 108)">
        <rect width="83" height="29" rx="5" fill="#fff" stroke="#344055" stroke-width="1.5"/>
        <text x="41.5" y="20" class="ink" font-size="17" font-weight="500" text-anchor="middle">ctrl</text>
        <g class="motion control-pressed">
          <rect width="83" height="29" rx="5" fill="#0a84ff"/>
          <text x="41.5" y="20" fill="#fff" font-size="17" font-weight="600" text-anchor="middle">ctrl</text>
        </g>
        <rect x="91" width="60" height="29" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/>
        <rect x="159" width="60" height="29" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/>
        <rect x="227" width="217" height="29" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/>
        <rect x="452" width="52" height="29" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/>
        <rect x="512" width="56" height="29" rx="5" fill="#fff" stroke="#c1cbd9" stroke-width="1.5"/>
        <text x="121" y="20" class="key-letter">option</text><text x="189" y="20" class="key-letter">⌘</text><text x="478" y="20" class="key-letter">⌘</text><text x="540" y="20" class="key-letter">fn</text>
      </g>
    </g>
    <text x="800" y="723" fill="#8a98ac" font-size="35" text-anchor="middle">+</text>

    <!-- Forward is the front side button; Back is the rear side button. -->
    <rect x="924" y="601" width="108" height="158" rx="50" fill="#fff" stroke="#344055" stroke-width="2"/>
    <path d="M924 655h108M978 602v53" class="line"/>
    <rect x="971" y="620" width="14" height="25" rx="7" fill="#e9edf4" stroke="#344055" stroke-width="1.5"/>
    <rect x="909" y="634" width="12" height="31" rx="5" fill="#e0e7f0" stroke="#344055" stroke-width="1.5"/>
    <rect x="909" y="675" width="12" height="31" rx="5" fill="#e0e7f0" stroke="#344055" stroke-width="1.5"/>
    <text x="887" y="655" class="ink" font-size="17" text-anchor="end">Forward</text>
    <text x="887" y="696" class="ink" font-size="17" text-anchor="end">Back</text>
    <path d="M896 649h7M896 690h7" class="muted-line"/>
    <g class="motion forward-pressed">
      <rect x="902" y="627" width="26" height="45" rx="10" fill="#0a84ff" opacity=".16"/>
      <rect x="909" y="634" width="12" height="31" rx="5" fill="#0a84ff"/>
      <text x="887" y="655" fill="#0864c1" font-size="17" font-weight="600" text-anchor="end">Forward</text>
    </g>
    <g class="motion back-pressed">
      <rect x="902" y="668" width="26" height="45" rx="10" fill="#0a84ff" opacity=".16"/>
      <rect x="909" y="675" width="12" height="31" rx="5" fill="#0a84ff"/>
      <text x="887" y="696" fill="#0864c1" font-size="17" font-weight="600" text-anchor="end">Back</text>
    </g>
  </g>
</svg>
